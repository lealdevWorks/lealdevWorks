name: Gerar cobrinha de contribuições

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

jobs:
  gerar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Gerar animação
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lealdevWorks
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#ff6a00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff6a00

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
